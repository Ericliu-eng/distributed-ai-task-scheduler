name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler -d scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://scheduler:scheduler@localhost:5432/scheduler_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile application modules
        run: python -m compileall -q app worker monitor bench

      - name: Run unit and PostgreSQL concurrency tests
        run: python -m pytest -q

      - name: Smoke-test benchmark runner
        run: python -m bench.run --tasks 24 --workers 4

      - name: Run routing cost-quality evaluation
        run: python -m bench.evaluate --output bench/results/routing-evaluation.json

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only
          SITE_ADDRESS: localhost
        run: docker compose -f deploy/compose.prod.yml config --quiet

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Check formatting
        run: terraform fmt -check -diff

      - name: Validate configuration
        run: terraform init -backend=false -input=false && terraform validate
