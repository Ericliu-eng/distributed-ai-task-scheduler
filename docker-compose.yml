services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      # Local tooling only; never publish the default credentials beyond loopback.
      # Set POSTGRES_PORT if another project already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@db:5432/scheduler
      # Enables /demo/reset and simulated failures; set "false" outside a local demo.
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  worker-small:
    build: .
    command: ["python", "-m", "worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@db:5432/scheduler
      WORKER_ID: worker-small-01
      MODEL_TIER: small
      LEASE_SECONDS: "15"
      LEASE_RENEW_INTERVAL: "3"
      RETRY_BASE_SECONDS: "1"
      RETRY_MAX_SECONDS: "30"
      PYTHONUNBUFFERED: "1"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  worker-large:
    build: .
    command: ["python", "-m", "worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@db:5432/scheduler
      WORKER_ID: worker-large-01
      MODEL_TIER: large
      LEASE_SECONDS: "15"
      LEASE_RENEW_INTERVAL: "3"
      RETRY_BASE_SECONDS: "1"
      RETRY_MAX_SECONDS: "30"
      PYTHONUNBUFFERED: "1"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  recovery-monitor:
    build: .
    command: ["python", "-m", "monitor.recovery"]
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@db:5432/scheduler
      RECOVERY_INTERVAL: "2"
      PYTHONUNBUFFERED: "1"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
